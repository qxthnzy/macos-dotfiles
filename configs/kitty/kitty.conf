# === General ===
font_size 22
font_family JetBrains Mono Nerd Font
background_opacity 0.8
cursor_shape beam
cursor_blink_interval 0

# === Window borders ===
window_border_width 1.5
draw_minimal_borders yes
window_margin_width 4
window_padding_width 6 10
active_border_color #a9df5a
inactive_border_color #304b70
hide_window_decorations titlebar-only
window_title_template "{title}"

# === Theme ===
# BEGIN_KITTY_THEME
# Bliss
include current-theme.conf
# END_KITTY_THEME

# === Tabs ===
tab_bar_style powerline
tab_powerline_style round
tab_bar_edge top
tab_bar_margin_width 20
tab_bar_margin_height 8 5
tab_title_template "{index}: {title}"
active_tab_foreground #0c1830
active_tab_background #a9df5a
inactive_tab_foreground #a9bfdb
inactive_tab_background #1c385f
active_tab_font_style bold
inactive_tab_font_style normal

# === Tab shortcuts ===
map cmd+shift+t new_tab
map cmd+shift+q close_tab
map cmd+shift+right next_tab
map cmd+shift+left previous_tab
map cmd+shift+. move_tab_forward
map cmd+shift+, move_tab_backward

# === Split shortcuts ===
enabled_layouts splits,stack
map cmd+shift+w close_window
map cmd+shift+d launch --type=window --location=vsplit
map cmd+shift+e launch --type=window --location=hsplit
# Pane navigation
map cmd+shift+] next_window
map cmd+shift+[ previous_window

# Pane resizing
map cmd+shift+up resize_window taller
map cmd+shift+down resize_window shorter

# Balance panes
map cmd+shift+home balance_windows
